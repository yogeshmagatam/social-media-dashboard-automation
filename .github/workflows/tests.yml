name: Social Media Dashboard - Test Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Playwright & SQL Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Pytest Suite with HTML Reporting
        env:
          HEADLESS: "true"
          BROWSER_TYPE: "chromium"
        run: |
          python -m pytest tests/ -v --html=reports/report.html --self-contained-html

      - name: Upload Test Report & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-execution-report
          path: |
            reports/report.html
            reports/screenshots/
          retention-days: 14
