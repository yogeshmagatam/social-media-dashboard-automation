[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Smoke test suite for quick validation of critical paths
    regression: Comprehensive regression suite for pre-release validation
    db: Direct SQL database persistence and integrity verification tests
    auth: Authentication and session management test cases
    navigation: UI routing and sidebar view tests
    functional: Functional features (posts, likes, filters)
    posts: Social media post lifecycle tests
    metrics: Real-time data and metric counter display tests
    ui: Frontend visual and DOM interaction tests
